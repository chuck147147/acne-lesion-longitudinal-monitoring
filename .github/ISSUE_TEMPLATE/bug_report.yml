name: 缺陷报告
description: 报告可复现的软件问题
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        请勿上传面部照片、健康信息、受试者编号、私有文件路径、访问令牌或模型权重。请用合成数据描述问题，并先清理日志。
  - type: input
    id: version
    attributes:
      label: 项目版本或提交号
      placeholder: 例如 Git commit 短哈希
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 使用入口
      options:
        - Windows 桌面入口
        - 命令行
        - 单图预测脚本
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请用合成数据或无个人信息的示例描述。
      placeholder: 1. ...\n2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与清理后的错误信息
      description: 发布前移除个人路径、受试者信息和令牌。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认没有附加面部照片、健康信息、个人标识、私有路径、模型权重或访问令牌。
          required: true
