name: 功能建议
description: 提出可复用的功能或改进建议
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请不要在公开 Issue 中附加面部照片、健康信息、受试者编号、私有文件路径或模型权重。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景和当前遇到的困难，不要写入个人健康资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认内容不含面部照片、健康信息、个人标识、私有路径或访问令牌。
          required: true
